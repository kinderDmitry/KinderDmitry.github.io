name: Check proxies
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python check.py
      - name: Commit results
        run: |
          git config user.name "proxy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.txt results.csv
          git diff --cached --quiet || git commit -m "update proxies"
          git push
